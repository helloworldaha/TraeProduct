<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2048 小游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">2048</h1>
            <div class="score-container">
                <div class="score-box">
                    <div class="score-label">分数</div>
                    <div class="score-value" id="score">0</div>
                </div>
                <div class="score-box">
                    <div class="score-label">最高分</div>
                    <div class="score-value" id="best-score">0</div>
                </div>
            </div>
        </header>

        <div class="intro">
            <p>使用 <strong>方向键</strong> 或 <strong>WASD</strong> 移动方块，相同数字合并获得更高分数！</p>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">步数：</span>
                <span class="stat-value" id="moves">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">时长：</span>
                <span class="stat-value" id="time">00:00</span>
            </div>
        </div>

        <div class="game-container">
            <div class="game-message" id="game-message">
                <div class="message-content">
                    <h2 id="message-title"></h2>
                    <p id="message-text"></p>
                    <button class="btn" id="message-btn">继续游戏</button>
                </div>
            </div>
            <div class="grid-container" id="grid-container">
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="start-btn">开始游戏</button>
            <button class="btn btn-secondary" id="restart-btn">重新开始</button>
        </div>

        <div class="game-status" id="game-status">
            点击"开始游戏"按钮开始
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
